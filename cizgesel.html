<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çizgesel v1.2 - Şablon Sürümü</title>
    <script src="cytoscape.min.js"></script>
    <style>
        /* TEMEL AYARLAR VE KARANLIK TEMA */
        :root {
            --bg-color: #002147;
            --panel-bg: rgba(20, 25, 40, 0.6);
            --neon: #0074f9;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column; 
            padding: 15px;
            gap: 15px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 116, 249, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(188, 19, 254, 0.05) 0%, transparent 50%);
        }

        /* ÜST NAVBAR (PENCERE KONTROLLERİ) */
        .top-navbar {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding-bottom: 10px; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            flex-shrink: 0; 
        }

        .navbar-title {
            color: var(--neon); 
            font-weight: bold; 
            letter-spacing: 2px; 
            text-shadow: 0 0 10px rgba(0, 116, 249, 0.3);
            font-size: 1.1rem;
        }

        /* ANA YERLEŞİM (NAVBAR ALTI) */
        .app-container {
            display: flex; 
            flex-direction: row; 
            width: 100%; 
            flex-grow: 1; 
            gap: 15px;
            min-height: 0; 
        }

        /* BUZLU CAM PANELLER */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            padding: 20px; display: flex; flex-direction: column; position: relative;
        }

        /* SOL MENÜ (ALGORİTMALAR) */
        .sidebar { 
            width: 300px; 
            flex-shrink: 0; 
            display: flex; 
            flex-direction: column; 
        }
        
        .sidebar h2 {
            font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px;
            color: var(--neon); margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 116, 249, 0.3); flex-shrink: 0;
        }

        /* KAYDIRILABİLİR AKSİYONLAR ALANI */
        .actions-container {
            flex-grow: 1; 
            overflow-y: auto; 
            display: flex; flex-direction: column; padding-right: 5px; margin-bottom: 15px;
            min-height: 0; 
        }

        .neon-btn {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(0, 116, 249, 0.2);
            color: var(--text-main); padding: 12px 15px; border-radius: 8px; cursor: pointer;
            font-weight: 600; font-size: 0.9rem; transition: all 0.3s ease; text-align: left;
            position: relative; overflow: hidden; margin-bottom: 10px; flex-shrink: 0;
        }
        .neon-btn:hover {
            background: rgba(0, 116, 249, 0.1); border-color: var(--neon);
            box-shadow: 0 0 15px rgba(0, 116, 249, 0.4); transform: translateY(-2px);
        }
        .neon-btn.purple { border-color: rgba(188, 19, 254, 0.2); }
        .neon-btn.purple:hover {
            background: rgba(188, 19, 254, 0.1); border-color: var(--neon);
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.4);
        }

        /* MANUEL GİRİŞ (SABİT ALT) */
        .manual-input-container { flex-shrink: 0; }

        /* SAĞ İÇERİK ALANI */
        .main-area { 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            min-width: 0;
        }

        /* MERKEZİ ÇİZGE ALANI */
        .graph-canvas {
            flex-grow: 1; display: flex; align-items: center; justify-content: center;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px; transition: all 0.3s ease;
            min-height: 0; 
        }

        /* TAM EKRAN MODU */
        .graph-canvas.fullscreen-mode {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 999; border-radius: 0; border: none;
            background-color: var(--bg-color); 
        }

        /* BÜYÜTME/KÜÇÜLTME BUTONU */
        .icon-btn {
            position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2); color: white; width: 30px; height: 30px;
            border-radius: 6px; cursor: pointer; display: flex; justify-content: center; align-items: center;
            transition: all 0.2s; z-index: 10;
        }
        .icon-btn:hover { background: var(--neon); border-color: var(--neon); }

        /* BENTO GRID (ALT VERİ PANELLERİ) */
        .bento-grid { 
            height: 250px; 
            display: grid; 
            grid-template-columns: 2fr 1fr 1fr; 
            gap: 15px; 
            flex-shrink: 0; 
        }
        
        .bento-box { display: flex; flex-direction: column; position: relative; overflow: hidden; }
        .bento-title { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; flex-shrink: 0; }
        .code-block { font-family: 'Consolas', 'Courier New', monospace; font-size: 0.85rem; color: #a5b4fc; overflow-y: auto; flex-grow: 1; min-height: 0; padding-right: 5px; }
        
        /* ÖZEL KAYDIRMA ÇUBUĞU */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon); }

        /* MATRİS MODAL (AÇILIR PENCERE) */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(8px);
            z-index: 1000; justify-content: center; align-items: center;
        }
        
        .modal-content {
            background: var(--panel-bg); border: 1px solid var(--neon);
            border-radius: 16px; padding: 25px; width: 80%; max-width: 800px; height: 80vh;
            display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(0, 116, 249, 0.2);
        }

        .matrix-container {
            flex-grow: 1; overflow: auto; margin: 20px 0;
            background: rgba(0,0,0,0.3); border-radius: 8px; padding: 15px;
        }

        .editable-matrix { border-collapse: collapse; margin: auto; }
        .editable-matrix th { color: var(--text-muted); font-size: 0.8rem; padding: 5px 10px; }
        .editable-matrix td { padding: 2px; }
        .matrix-input {
            width: 40px; height: 40px; text-align: center; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); color: var(--neon);
            font-family: monospace; font-size: 1.1rem; border-radius: 4px; transition: all 0.2s;
        }
        .matrix-input:focus { outline: none; border-color: var(--neon); background: rgba(0, 116, 249, 0.1); }
        
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        /* --- ÇİZİM ARAÇ ÇUBUĞU (EDIT TOOLBAR) --- */
        .edit-toolbar {
            position: absolute; top: 10px; left: 10px; height: 30px; z-index: 100;
            display: none; align-items: center; gap: 4px; background: rgba(13, 17, 25, 0.95); 
            padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 2px solid var(--neon); backdrop-filter: blur(15px); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }
        
        .tool-btn {
            background: transparent; color: rgba(255, 255, 255, 0.6); border: 1px solid transparent; 
            padding: 3px 10px; border-radius: 5px; cursor: pointer; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            font-size: 0.8rem; font-weight: 500; transition: all 0.2s ease; display: flex; 
            align-items: center; gap: 6px; letter-spacing: 0.5px; height: 26px; 
        }
        
        .tool-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.06); }
        .tool-btn.active { background: rgba(0, 243, 255, 0.08); color: var(--neon); border: 1px solid rgba(0, 243, 255, 0.3); box-shadow: inset 0 0 4px rgba(0, 243, 255, 0.1); }
        .tool-btn.delete-btn.active { background: rgba(255, 77, 77, 0.08); color: #ff4d4d; border-color: rgba(255, 77, 77, 0.3); box-shadow: inset 0 0 4px rgba(255, 77, 77, 0.1); }
        .toolbar-divider { width: 1px; height: 14px; background: rgba(255, 255, 255, 0.15); margin: 0 2px; }
        .tool-icon { font-size: 0.95rem; font-weight: normal; display: flex; align-items: center; }
    </style>
</head>
<body>

<div class="top-navbar">
    <div class="navbar-title">
        ÇİZGESEL // v1.2 Şablon
    </div>
    
    <div style="display: flex; gap: 10px;">
        <button  class="kucult-butonu neon-btn" onclick="sendToMatlab('PencereKucult', '')" style="padding: 5px 15px; margin-bottom: 0; background: transparent; border-color: rgba(255,255,255,0.2);" 
                onclick="sendToMatlab('Pencere', 'Kucult')">
            _
        </button>
        
        <button class="kapat-butonu neon-btn" onclick="sendToMatlab('PencereKapat', '')" style="padding: 5px 15px; margin-bottom: 0; background: rgba(255,0,0,0.1); border-color: rgba(255,0,0,0.4); color: #ff4d4d;" 
                onmouseover="this.style.boxShadow='0 0 15px rgba(255,0,0,0.5)';" 
                onmouseout="this.style.boxShadow='none';" 
                onclick="sendToMatlab('Pencere', 'Kapat')">
            X
        </button>
    </div>
</div>

<div class="app-container">
    
    <div class="glass-panel sidebar">
        <h2>Menü</h2>
        
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px;">Aksiyonlar</p>
        
        <div class="actions-container">
            <!-- Butonlar JavaScript üzerinden MATLAB'a veri göndermeye devam ediyor -->
            <button class="neon-btn" onclick="if(cy && currentMatrixData && currentMatrixData.length > 0) { sendToMatlab('HavelHakimiAdimli', currentMatrixData); logEkle('> Bilgi: Mevcut çizim üzerinden analiz yapılıyor.'); } else { let diziGirdisi = document.getElementById('dereceDizisi').value; sendToMatlab('HavelHakimiAdimli', diziGirdisi); }">▶ Havel-Hakimi Çalıştır</button>
            <button class="neon-btn purple" onclick="sendToMatlab('Fleury', currentMatrixData)">▶ Fleury Yolu Bul</button>
            <button class="neon-btn purple" onclick="sendToMatlab('Ore', 'GirisIstendi')">▶ Ore Teoremi</button>
            <button class="neon-btn purple" onclick="sendToMatlab('Dirac', 'GirisIstendi')">▶ Dirac Teoremi</button>
            <button class="neon-btn purple" onclick="sendToMatlab('Hamilton', 'GirisIstendi')">▶ Hamiltonlık Bul</button>
            <button class="neon-btn purple" onclick="if(cy && currentMatrixData && currentMatrixData.length > 0) { sendToMatlab('BaglantililikAnalizi', currentMatrixData); } else { logEkle('> HATA: Analiz edilecek bir graf yok. Önce çizim yapın.'); }">▶ Bağlantılılık Bul</button>
            <button class="neon-btn purple" onclick="if(cy && currentMatrixData && currentMatrixData.length > 0) { sendToMatlab('IkiParcaliAnaliz', currentMatrixData); } else { logEkle('> HATA: Analiz edilecek bir graf yok. Önce çizim yapın.'); }">▶ İki Parçalılık Bul</button>
            <button class="neon-btn purple" onclick="if(cy && currentMatrixData && currentMatrixData.length > 0) { sendToMatlab('MaksKlikBul', currentMatrixData); } else { logEkle('> HATA: Analiz edilecek bir graf yok. Önce çizim yapın.'); }">▶ Maks Klik Bul</button>
            <button class="neon-btn purple" onclick="if(cy && currentMatrixData && currentMatrixData.length > 0) { sendToMatlab('MaksBagimsizKume', currentMatrixData); } else { logEkle('> HATA: Analiz edilecek bir graf yok. Önce çizim yapın.'); }">▶ Maks B'sız Küme Bul</button>
            <button class="neon-btn purple" onclick="if(cy && currentMatrixData && currentMatrixData.length > 0) { sendToMatlab('EnUzunYolBul', currentMatrixData); } else { logEkle('> HATA: Analiz edilecek bir graf yok. Önce çizim yapın.'); }">▶ En Uzun Yolu Bul</button>
            <button class="neon-btn" style="border-color: rgba(255,255,255,0.2);" onclick="temizle()">↺ Çizgeyi Temizle</button>
        </div>

        <div class="manual-input-container">
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px;">Manuel Giriş</p>
            <input type="text" id="dereceDizisi" placeholder="Örn: 4,3,2,2,1" 
                   style="width: 100%; padding: 10px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 6px; margin-bottom: 10px; font-family: monospace;">
            <button class="neon-btn" style="width: 100%; text-align: center; margin-bottom: 0;" onclick="gonderDerece()">Diziyi Çiz</button>
        </div>
    </div>

    <div class="main-area">
        
        <div class="glass-panel graph-canvas" id="canvas-area">
            <button class="icon-btn" id="editBtn" onclick="toggleEditToolbar()" title="Düzenleme Modunu Aç/Kapat" style="z-index: 9999; right: 55px;">✏️</button>
            <button class="icon-btn" id="fsBtn" onclick="toggleCanvasFullscreen()" title="Tam Ekran" style="z-index: 9999;">⛶</button>
            <div class="edit-toolbar" id="editToolbar">
                <button class="tool-btn active" id="btn_none" onclick="setEditMode('none')" title="Taşı ve İncele">
                    <span class="tool-icon">⬚</span> Serbest
                </button>
                <div class="toolbar-divider"></div>
                <button class="tool-btn" id="btn_addNode" onclick="setEditMode('addNode')" title="Düğüm Ekle">
                    <span class="tool-icon">○</span> Düğüm
                </button>
                <button class="tool-btn" id="btn_addEdge" onclick="setEditMode('addEdge')" title="Kenar Ekle">
                    <span class="tool-icon">╱</span> Kenar
                </button>
                <div class="toolbar-divider"></div>
                <button class="tool-btn delete-btn" id="btn_delete" onclick="setEditMode('delete')" title="Sil">
                    <span class="tool-icon">✕</span> Sil
                </button>
            </div>
            <div id="cy-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;"></div>
            
            <div id="bekleme-yazisi" style="position: absolute; bottom: 15px; right: 15px; color: rgba(255,255,255,0.2); font-family: monospace; z-index: 10;">
                Görselleştirme Bekleniyor...
            </div>
        </div>

        <div class="bento-grid">
            <div class="glass-panel bento-box">
                <div class="bento-title">Sistem Günlüğü</div>
                <div class="code-block" id="logPanel">> Sistem başlatıldı.<br></div>
            </div>

            <div class="glass-panel bento-box">
                <div class="bento-title">Komşuluk Matrisi</div>
                <button class="icon-btn" onclick="openMatrixModal()" title="Matrisi Düzenle">⛶</button>
                <div class="code-block" id="matrixPreview" style="color: var(--neon);">
                    [0 1 0]<br>[1 0 1]<br>[0 1 0]
                </div>
            </div>

            <div class="glass-panel bento-box">
                <div class="bento-title">Metrikler</div>
                <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
                    <div style="display: flex; justify-content: space-between;"><span style="color: var(--text-muted);">Düğüm (V):</span><span style="color: white; font-weight: bold;" id="nodeCount">0</span></div>
                    <div style="display: flex; justify-content: space-between;"><span style="color: var(--text-muted);">Ayrıt (E):</span><span style="color: white; font-weight: bold;" id="edgeCount">0</span></div>
                    <div style="display: flex; justify-content: space-between;"><span style="color: var(--text-muted);">Durum:</span><span style="color: var(--neon); font-weight: bold;" id="status">Beklemede</span></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="matrixModal">
    <div class="modal-content">
        <h2 style="color: var(--neon); margin-bottom: 10px;">Komşuluk Matrisi Düzenleyici</h2>
        
        <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1);">
            <label style="color: var(--text-muted); font-size: 0.9rem;">Düğüm Sayısı (NxN):</label>
            <input type="number" id="matrisBoyutu" min="1" max="50" value="3" 
                   style="width: 70px; padding: 5px; background: rgba(0,0,0,0.5); border: 1px solid var(--neon); color: white; text-align: center; border-radius: 4px; font-family: monospace; font-size: 1rem;">
            <button class="neon-btn" style="margin: 0; padding: 6px 15px;" onclick="matrisiYenidenBoyutlandir()">Oluştur</button>
        </div>

        <div class="matrix-container" style="overflow: auto; max-height: 50vh; margin-top: 0;">
            <table class="editable-matrix" id="editableMatrixTable"></table>
        </div>
        
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px;">
            <button class="neon-btn" style="border-color: rgba(255,255,255,0.2); margin: 0;" onclick="closeMatrixModal()">İptal</button>
            <button class="neon-btn" style="background: rgba(0, 116, 249, 0.2); margin: 0;" onclick="saveAndSendMatrix()">Kaydet ve MATLAB'a Gönder</button>
        </div>
    </div>
</div>

<script>
    var mlComponent;
    var cy;
    var currentMatrixData = [
        [0, 1, 0],
        [1, 0, 1],
        [0, 1, 0]
    ];

    function setup(htmlComponent) {
        mlComponent = htmlComponent;
        logEkle("> Girdi bekleniyor...");
        
        mlComponent.addEventListener("DataChanged", function(event) {
            try {
                var data = JSON.parse(mlComponent.Data);
                
                if(data.aksiyon === "log_yaz") { 
                    logEkle(data.mesaj); 
                } 
                else if (data.aksiyon === "cizge_ciz") {
                    logEkle("> Çizge verisi alındı. Tuvale aktarılıyor...");
                    
                    if(data.matris) {
                        currentMatrixData = data.matris;
                        updateMatrixPreview(); 
                    }
                    var beklemeEkrani = document.getElementById('bekleme-yazisi');
                    if(beklemeEkrani) beklemeEkrani.style.display = 'none';
                    
                    if(data.metrik) {
                        var nodeC = document.getElementById('nodeCount');
                        if(nodeC) nodeC.innerText = data.metrik.dugum;

                        var edgeC = document.getElementById('edgeCount');
                        if(edgeC) edgeC.innerText = data.metrik.ayrit;

                        var statusC = document.getElementById('status');
                        if(statusC) {
                            let sureMetni = data.metrik.sure ? " (" + data.metrik.sure.toFixed(4) + " sn)" : "";
                            statusC.innerText = data.metrik.durum + sureMetni;
                        }
                    }

                    if (cy) { cy.destroy(); }

                    var cyContainer = document.getElementById('cy-container');
                    if(!cyContainer) {
                        logEkle("> HATA KODU: HTML içinde 'cy-container' id'li div bulunamadı!");
                        return; 
                    }

                    // Cytoscape Motorunu Başlat (Görsel temel ayarlar korundu)
                    cy = cytoscape({
                        container: cyContainer,
                        elements: data.elements,
                        style: [
                            {
                                selector: 'node',
                                style: {
                                    'background-color': '#0074f9', 
                                    'border-width': '3px',
                                    'border-color': '#0070f3',
                                    'shadow-blur': 25,
                                    'shadow-color': '#0074f9', 
                                    'shadow-opacity': 0.9,
                                    'underlay-color': '#0074f9',
                                    'underlay-padding': 4,
                                    'underlay-opacity': 0.6,
                                    'underlay-shape': 'ellipse',
                                    'label': 'data(label)',
                                    'color': '#fff',
                                    'font-size': '14px',
                                    'font-family': 'monospace',
                                    'font-weight': 'bold',
                                    'text-valign': 'center',
                                    'text-halign': 'center',
                                    'text-outline-color': '#0b0f19', 
                                    'text-outline-width': '2px',
                                    'width': '40px',
                                    'height': '40px'
                                }
                            },
                            {
                                selector: 'edge',
                                style: {
                                    'width': 3,
                                    'line-color': '#a5b4fc', 
                                    'curve-style': 'bezier',
                                    'shadow-blur': 15,
                                    'shadow-color': '#a5b4fc',
                                    'shadow-opacity': 0.8
                                }
                            },
                            { 
                                selector: ':selected',
                                style: {
                                    'background-color': '#0074f9',
                                    'border-color': '#fff',
                                    'shadow-color': '#0074f9',
                                    'shadow-blur': 40,
                                    'shadow-opacity': 1,
                                    'underlay-padding': 8
                                }
                            }
                        ],
                        layout: {
                            name: 'cose', 
                            idealEdgeLength: 100,
                            nodeOverlap: 20,
                            refresh: 20,
                            fit: true,
                            padding: 30,
                            randomize: true,
                            componentSpacing: 100,
                            nodeRepulsion: 400000,
                            edgeElasticity: 100,
                            nestingFactor: 5,
                            gravity: 80,
                            numIter: 1000,
                            initialTemp: 200,
                            coolingFactor: 0.95,
                            minTemp: 1.0
                        }
                    });

                    // --- ETKİLEŞİMLİ ÇİZİM OLAYLARI KORUNDU ---
                    var sourceNode = null; 

                    cy.on('tap', function(evt) {
                        if (currentEditMode === 'addNode' && evt.target === cy) {
                            var newId = 'n' + Date.now(); 
                            cy.add({
                                group: 'nodes',
                                data: { id: newId, label: 'vX' }, 
                                position: { x: evt.position.x, y: evt.position.y }
                            });
                            syncGraphToMatrix(); 
                        }
                    });

                    cy.on('tap', 'node', function(evt) {
                        var node = evt.target;
                        if (currentEditMode === 'delete') {
                            cy.remove(node); 
                            syncGraphToMatrix();
                        } 
                        else if (currentEditMode === 'addEdge') {
                            if (!sourceNode) {
                                sourceNode = node;
                                node.style({'border-color': '#00f7ff', 'border-width': '6px'});
                            } else {
                                if (sourceNode.id() !== node.id()) {
                                    var mevcut = cy.edges(`[source="${sourceNode.id()}"][target="${node.id()}"], [source="${node.id()}"][target="${sourceNode.id()}"]`);
                                    if(mevcut.length === 0) {
                                        cy.add({
                                            group: 'edges',
                                            data: { id: 'e' + Date.now(), source: sourceNode.id(), target: node.id() }
                                        });
                                        syncGraphToMatrix();
                                    }
                                }
                                sourceNode.style({'border-color': '#0074f9', 'border-width': '4px'});
                                sourceNode = null;
                            }
                        }
                    });

                    cy.on('tap', 'edge', function(evt) {
                        if (currentEditMode === 'delete') {
                            cy.remove(evt.target);
                            syncGraphToMatrix();
                        }
                    });
                    cy.userZoomingEnabled(true);
                }
                
                // =========================================================
                // [ALGORİTMA ANİMASYONLARI YER TUTUCULARI]
                // Öğrenciler MATLAB'dan veri gönderdikten sonra görsel 
                // işlemleri bu blokların içine yazacaklar.
                // =========================================================
                
                else if (data.aksiyon === "fleury_animasyon") {
                    // MATLAB'dan gelen veri: data.yol (Örn: [1, 2, 3, 1])
                    // [KENDİ FLEURY BOYAMA/ANİMASYON KODUNUZU BURAYA YAZIN]
                    logEkle("> Fleury boyama işlemi için JS kodunun yazılması bekleniyor.");
                }
                
                else if (data.aksiyon === "iki_parcali_boya") {
                    // MATLAB'dan gelen veri: data.basarili, data.kume1, data.kume2 vb.
                    // [KENDİ İKİ PARÇALILIK BOYAMA KODUNUZU BURAYA YAZIN]
                    logEkle("> İki Parçalı boyama işlemi için JS kodunun yazılması bekleniyor.");
                }
                
                else if (data.aksiyon === "klik_boya") {
                    // MATLAB'dan gelen veri: data.klik (Örn: [1, 2, 5])
                    // [KENDİ KLİK BOYAMA KODUNUZU BURAYA YAZIN]
                    logEkle("> Maksimum Klik boyama işlemi için JS kodunun yazılması bekleniyor.");
                }
                
                else if (data.aksiyon === "yol_boya") {
                    // MATLAB'dan gelen veri: data.yol
                    // [KENDİ EN UZUN YOL BOYAMA KODUNUZU BURAYA YAZIN]
                    logEkle("> En Uzun Yol boyama işlemi için JS kodunun yazılması bekleniyor.");
                }
                
                else if (data.aksiyon === "bagimsiz_kume_boya") {
                    // MATLAB'dan gelen veri: data.kume
                    // [KENDİ BAĞIMSIZ KÜME BOYAMA KODUNUZU BURAYA YAZIN]
                    logEkle("> Bağımsız Küme boyama işlemi için JS kodunun yazılması bekleniyor.");
                }
                
            } catch(e) { logEkle("> Veri okuma hatası: " + e.message); }
        });
    }

    // --- AŞAĞIDAKİ MATRİS VE UI FONKSİYONLARI KORUNDU ---

    function openMatrixModal() {
        document.getElementById('matrixModal').style.display = 'flex';
        document.getElementById('matrisBoyutu').value = currentMatrixData.length;
        buildEditableMatrix(currentMatrixData);
    }

    function matrisiYenidenBoyutlandir() {
        var yeniBoyut = parseInt(document.getElementById('matrisBoyutu').value);
        if(isNaN(yeniBoyut) || yeniBoyut < 1) return;
        var yeniMatris = [];
        for(let i=0; i<yeniBoyut; i++) {
            var satir = [];
            for(let j=0; j<yeniBoyut; j++) {
                satir.push(0);
            }
            yeniMatris.push(satir);
        }
        currentMatrixData = yeniMatris;
        buildEditableMatrix(currentMatrixData);
        logEkle("> " + yeniBoyut + "x" + yeniBoyut + " boyutunda boş matris oluşturuldu.");
    }

    function buildEditableMatrix(data2D) {
        var table = document.getElementById('editableMatrixTable');
        table.innerHTML = ''; 
        var size = data2D.length;
        var headerRow = document.createElement('tr');
        headerRow.innerHTML = '<th></th>'; 
        for(let i=0; i<size; i++) { headerRow.innerHTML += '<th>v' + (i+1) + '</th>'; }
        table.appendChild(headerRow);

        for(let i=0; i<size; i++) {
            let tr = document.createElement('tr');
            tr.innerHTML = '<th>v' + (i+1) + '</th>';
            for(let j=0; j<size; j++) {
                let td = document.createElement('td');
                let input = document.createElement('input');
                input.type = 'number'; 
                input.min = '0'; input.max = '1'; 
                input.className = 'matrix-input';
                input.value = data2D[i][j];
                td.appendChild(input);
                tr.appendChild(td);
            }
            table.appendChild(tr);
        }
    }

    function sendToMatlab(islemTuru, detay) {
        if (mlComponent) {
            var paket = { 
                "islem": islemTuru, 
                "detay": detay,
                "zaman": Date.now() 
            };
            mlComponent.Data = JSON.stringify(paket);
            logEkle("> Komut Gönderildi: " + islemTuru);
        } else {
            console.log("TEST MODU: ", islemTuru, detay);
        }
    }

    function gonderDerece() {
        var dizi = document.getElementById('dereceDizisi').value;
        if(dizi !== "") sendToMatlab("DereceDizisiCiz", dizi);
    }

    function logEkle(mesaj) {
        var panel = document.getElementById('logPanel');
        panel.innerHTML += mesaj + "<br>";
        panel.scrollTop = panel.scrollHeight;
    }
    
    function temizle() {
        try {
            if (typeof cy !== 'undefined' && cy !== null) { cy.destroy(); cy = null; }
            currentMatrixData = []; 
            updateMatrixPreview(); 
            var cyContainer = document.getElementById('cy-container');
            if (cyContainer) cyContainer.innerHTML = ''; 
            var beklemeEkrani = document.getElementById('bekleme-yazisi');
            if (beklemeEkrani) beklemeEkrani.style.display = 'block';
            if(document.getElementById('nodeCount')) document.getElementById('nodeCount').innerText = "0";
            if(document.getElementById('edgeCount')) document.getElementById('edgeCount').innerText = "0";
            if(document.getElementById('status')) document.getElementById('status').innerText = "Beklemede";
            var toolbar = document.getElementById('editToolbar');
            if(toolbar) toolbar.style.display = 'none';
            logEkle("> Sistem ve matris tamamen temizlendi.");
        } catch(e) { logEkle("> TEMİZLEME HATASI: " + e.message); }
    }

    var currentEditMode = 'none';

    function toggleEditToolbar() {
        var toolbar = document.getElementById('editToolbar');
        if (!cy) {
            logEkle("> Tuval boş algılandı. Serbest çizim için hazırlanıyor...");
            sifirdanBasla(); 
            toolbar.style.display = 'flex';
            return; 
        }
        if (toolbar.style.display === 'none' || toolbar.style.display === '') {
            toolbar.style.display = 'flex';
            setEditMode('none');
            logEkle("> Düzenleme Modu: AÇIK");
        } else {
            toolbar.style.display = 'none';
            setEditMode('none');
            logEkle("> Düzenleme Modu: KAPALI");
        }
    }

    function sifirdanBasla() {
        var beklemeEkrani = document.getElementById('bekleme-yazisi');
        if(beklemeEkrani) beklemeEkrani.style.display = 'none';
        document.getElementById('nodeCount').innerText = "0";
        document.getElementById('edgeCount').innerText = "0";
        document.getElementById('status').innerText = "Serbest Çizim";
        currentMatrixData = []; updateMatrixPreview();
        if (cy) { cy.destroy(); cy = null; }
        
        var cyContainer = document.getElementById('cy-container');
        cyContainer.innerHTML = '';
        cy = cytoscape({
            container: cyContainer,
            elements: [], 
            style: [
                {
                    selector: 'node',
                    style: {
                        'background-color': '#0074f9', 'border-width': '4px', 'border-color': '#0074f9',
                        'shadow-blur': 40, 'shadow-color': '#0074f9', 'shadow-opacity': 1, 
                        'underlay-color': '#0074f9', 'underlay-padding': 12, 'underlay-opacity': 0.4, 'underlay-shape': 'ellipse',
                        'label': 'data(label)', 'color': '#ffffff', 'font-size': '16px', 'font-family': 'monospace',
                        'font-weight': 'bold', 'text-valign': 'center', 'text-halign': 'center',
                        'text-outline-color': '#0b0f19', 'text-outline-width': '3px', 'width': '45px', 'height': '45px'
                    }
                },
                { selector: 'edge', style: { 'width': 4, 'line-color': '#0074f9', 'shadow-blur': 20, 'shadow-color': '#0074f9', 'shadow-opacity': 0.8, 'curve-style': 'bezier' } },
                { selector: ':selected', style: { 'background-color': '#00f7ff', 'border-color': '#0074f9', 'shadow-color': '#0074f9', 'shadow-blur': 60, 'shadow-opacity': 1, 'underlay-padding': 15, 'underlay-opacity': 0.8 } }
            ],
            layout: { name: 'preset' } 
        });

        var toolbar = document.getElementById('editToolbar');
        if (toolbar) toolbar.style.display = 'flex';
        setEditMode('addNode'); 
        var sourceNode = null;

        cy.on('tap', function(evt) {
            if (currentEditMode === 'addNode' && evt.target === cy) {
                cy.add({ group: 'nodes', data: { id: 'n' + Date.now(), label: 'vX' }, position: { x: evt.position.x, y: evt.position.y } });
                syncGraphToMatrix();
            }
        });

        cy.on('tap', 'node', function(evt) {
            var node = evt.target;
            if (currentEditMode === 'delete') { cy.remove(node); syncGraphToMatrix(); } 
            else if (currentEditMode === 'addEdge') {
                if (!sourceNode) { sourceNode = node; node.style({'border-color': '#00f7ff', 'border-width': '6px'}); } 
                else {
                    if (sourceNode.id() !== node.id()) {
                        var mevcut = cy.edges(`[source="${sourceNode.id()}"][target="${node.id()}"], [source="${node.id()}"][target="${sourceNode.id()}"]`);
                        if(mevcut.length === 0) { cy.add({ group: 'edges', data: { id: 'e' + Date.now(), source: sourceNode.id(), target: node.id() } }); syncGraphToMatrix(); }
                    }
                    sourceNode.style({'border-color': '#0074f9', 'border-width': '4px'}); sourceNode = null;
                }
            }
        });

        cy.on('tap', 'edge', function(evt) {
            if (currentEditMode === 'delete') { cy.remove(evt.target); syncGraphToMatrix(); }
        });
    }

    function setEditMode(mode) {
        currentEditMode = mode;
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn_' + mode).classList.add('active');
    }

    function syncGraphToMatrix() {
        if (!cy) return;
        var nodes = cy.nodes(); var edges = cy.edges(); var n = nodes.length;
        var yeniMatris = []; var dereceler = []; 
        for(let i=0; i<n; i++) { yeniMatris.push(new Array(n).fill(0)); }
        var idToIndex = {};
        for(let i=0; i<n; i++) { var node = nodes[i]; idToIndex[node.id()] = i; node.data('label', 'v' + (i+1)); }
        edges.forEach(function(edge) {
            var i = idToIndex[edge.data('source')]; var j = idToIndex[edge.data('target')];
            if(i !== undefined && j !== undefined) { yeniMatris[i][j] = 1; yeniMatris[j][i] = 1; }
        });
        for(let i=0; i<n; i++) { let derece = yeniMatris[i].reduce((a, b) => a + b, 0); dereceler.push(derece); }
        dereceler.sort((a, b) => b - a);
        var inputAlani = document.getElementById('dereceDizisi');
        if(inputAlani) { inputAlani.value = dereceler.join(','); }
        currentMatrixData = yeniMatris; updateMatrixPreview();
        document.getElementById('nodeCount').innerText = n; document.getElementById('edgeCount').innerText = edges.length; document.getElementById('status').innerText = "Graf Düzenlendi";
    }

    function toggleCanvasFullscreen() {
        var canvasArea = document.getElementById('canvas-area');
        var fsBtn = document.getElementById('fsBtn'); 
        canvasArea.classList.toggle('fullscreen-mode'); 
        if (canvasArea.classList.contains('fullscreen-mode')) {
            if(fsBtn) fsBtn.innerHTML = '✖'; if(fsBtn) fsBtn.style.color = '#ff4d4d'; 
        } else {
            if(fsBtn) fsBtn.innerHTML = '⛶'; if(fsBtn) fsBtn.style.color = ''; 
        }
    }

    function closeMatrixModal() { document.getElementById('matrixModal').style.display = 'none'; }

    function saveAndSendMatrix() {
        var table = document.getElementById('editableMatrixTable');
        var inputs = table.getElementsByTagName('input');
        var size = Math.sqrt(inputs.length); 
        var yeniMatris = []; var k = 0;
        for(let i=0; i<size; i++) {
            var satir = [];
            for(let j=0; j<size; j++) { satir.push(parseInt(inputs[k].value) || 0); k++; }
            yeniMatris.push(satir);
        }
        currentMatrixData = yeniMatris; updateMatrixPreview(); closeMatrixModal();
        sendToMatlab('MatrisDuzenlendi', yeniMatris);
    }

    function updateMatrixPreview() {
        var previewBox = document.getElementById('matrixPreview');
        if (!previewBox) return;
        if (!currentMatrixData || currentMatrixData.length === 0) {
            previewBox.innerHTML = '<span style="color:rgba(255,255,255,0.2); font-style:italic;">Matris verisi yok...</span>';
            return;
        }
        var html = ''; var limit = Math.min(currentMatrixData.length, 5); 
        for(let i=0; i<limit; i++) {
            if (!Array.isArray(currentMatrixData[i])) { currentMatrixData[i] = [currentMatrixData[i]]; }
            html += '[' + currentMatrixData[i].slice(0, limit).join(' ') + ']<br>';
        }
        if(currentMatrixData.length > 5) html += '...'; 
        previewBox.innerHTML = html;
    }
</script>
